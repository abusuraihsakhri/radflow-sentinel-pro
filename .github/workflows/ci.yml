name: Python tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: "ci-only-audit-key-not-for-production"
      API_TOKEN: "ci-only-api-token-not-for-production"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest httpx
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents radflow_sentinel_pro cli.py radflow_sentinel_pro.py enrichment.py simulator.py
      - name: Check browser JavaScript
        run: node --check web/app.js
      - name: Run tests
        run: python -m pytest -q
