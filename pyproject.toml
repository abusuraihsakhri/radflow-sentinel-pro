[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radflow-sentinel-pro"
version = "2.0.0"
description = "RadFlow Sentinel Pro: Autonomous Radiology Critical Finding Escalation & Incidentaloma Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.scripts]
radflow-sentinel-pro = "radflow_sentinel_pro.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/radflow-sentinel-pro"
Repository = "https://github.com/abusuraihsakhri/radflow-sentinel-pro.git"

[tool.setuptools.packages.find]
include = ["agents*", "radflow_sentinel_pro*"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "unit_test_*.py"]
testpaths = ["tests"]
