[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radflow-sentinel-pro"
version = "2.0.0"
description = "RadFlow Sentinel Pro: Autonomous Radiology Critical Finding Escalation & Incidentaloma Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
radflow-sentinel-pro = "radflow_sentinel_pro.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/radflow-sentinel-pro"
Repository = "https://github.com/abusuraihsakhri/radflow-sentinel-pro.git"
