version: '3.8'

services:
  radflow-sentinel-pro:
    build: .
    container_name: radflow-sentinel-pro
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
